[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddx"
version = "1.0.0"
description = "Medical Diagnosis System: Random Forest + Bayesian Optimization + Bayesian (PyMC) updating on UCI Heart Disease"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pymc>=5.16",
    "arviz>=0.18",
    "numba>=0.59",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbconvert", "ipykernel"]
reporting = ["python-docx>=1.2,<2", "nbformat>=5.9", "nbconvert>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: runs MCMC sampling (deselect with -m 'not slow')"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
